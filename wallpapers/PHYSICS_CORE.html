<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PHYSICS CORE — Singularity Engine · Dynamic Wallpaper</title>
<style>
  :root { --cyan:#7ae9ff; --gold:#ffcb87; --white:#e6faff; }
  * {box-sizing:border-box}
  html,body {width:100%;height:100%;margin:0;overflow:hidden;background:#010510;color:var(--white);font-family:Inter,Segoe UI,Arial,"Microsoft YaHei",sans-serif;user-select:none}
  canvas {position:fixed;inset:0;display:block;width:100%;height:100%}
  #space {z-index:0} #orbits {z-index:1}
  .filmgrain {position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath filter='url(%23n)' opacity='.2' d='M0 0h160v160H0z'/%3E%3C/svg%3E");mix-blend-mode:screen}
  .vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 49%,transparent 30%,rgba(0,3,12,.06) 56%,rgba(0,2,10,.76) 100%)}
  .interface {position:fixed;z-index:10;right:24px;bottom:28px;display:flex;gap:5px;opacity:.07;transition:opacity .22s ease;transform:translateZ(0)}
  .interface:hover,.interface:focus-within{opacity:1}
  .interface button,.interface label{display:flex;justify-content:center;align-items:center;width:34px;height:34px;border:1px solid rgba(127,222,247,.30);color:#b8e4ed;background:rgba(1,17,31,.72);padding:0;border-radius:5px;cursor:pointer;font:16px Consolas,monospace;backdrop-filter:blur(8px)}
  .interface button:hover,.interface label:hover{background:rgba(21,84,112,.8);color:#fff}
  .interface input{display:none}
  .toast{position:fixed;top:9vh;left:50%;z-index:20;transform:translateX(-50%);border:1px solid #396879;background:#031b2ad9;color:#c1f3ff;padding:8px 17px;font:11px Consolas,monospace;letter-spacing:.1em;opacity:0;transition:opacity .5s;pointer-events:none}
  @media(max-width:600px){.interface{right:12px;bottom:24px}}
  .ui-off .interface{display:none}
  body.meteor-aim{cursor:crosshair}
  .interface button[aria-pressed="false"]{color:rgba(148,183,202,.48)}

/* Optional V1.2 performance monitor. Press P, or use PERF button. */
.perf-panel{display:none;position:fixed;z-index:15;top:116px;right:28px;width:265px;padding:14px 16px;border:1px solid rgba(112,218,245,.32);border-radius:6px;
background:rgba(2,12,25,.92);backdrop-filter:blur(10px);box-shadow:0 14px 50px #0009;color:#a9d7e7;font:11px/1.7 Consolas,monospace;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.perf-panel.open{display:block}
.perf-head{display:flex;justify-content:space-between;align-items:center;color:#ffca88;font-size:10px;letter-spacing:.16em;margin-bottom:9px}
.perf-head button{border:0;color:#9cc8d5;background:none;cursor:pointer;font:18px Consolas}
.perf-head button:hover{color:#fff}
.perf-row{display:flex;justify-content:space-between;gap:15px;padding:3px 0;border-bottom:1px solid #9cc6d619}
.perf-row b{font-weight:500;color:#e4f7ff;white-space:nowrap}
.perf-row b.warn{color:#ffbf85}
.perf-chart{height:35px;display:flex;gap:3px;align-items:flex-end;margin:10px 0;border-bottom:1px solid #9cc6d633}
.perf-chart i{flex:1;min-width:2px;background:#68cee9;box-shadow:0 0 5px #4ad0ff55}
.perf-chart i.warn{background:#e8ac70}
.perf-info{font:9px/1.65 Consolas,monospace;color:#86a6b8;letter-spacing:0}
@media(max-width:600px){.perf-panel{top:56px;right:12px;width:min(265px,calc(100vw - 24px))}}

</style>
</head>
<body>
<canvas id="space"></canvas>
<canvas id="orbits"></canvas>
<div class="filmgrain"></div><div class="vignette"></div>
<div class="interface" aria-label="壁纸操作按钮"><button id="demoBtn" aria-label="演示脉冲" title="模拟音乐节拍">◈</button><label aria-label="导入本地音乐" title="导入本地音乐">♫<input type="file" id="audioFile" accept="audio/*"></label><button id="hudBtn" aria-label="隐藏操作按钮" title="隐藏操作按钮（按H恢复）">◻</button><button id="perfBtn" aria-label="性能监视" title="性能监视（按P开关）">▤</button><button id="meteorBtn" type="button" aria-pressed="true" aria-label="陨石互动" title="陨石互动（M切换）">☄</button></div>

<div class="perf-panel" id="perfPanel" aria-label="性能监视面板">
  <div class="perf-head"><span>◈ PERFORMANCE / LIVE</span><button id="perfClose" type="button" title="关闭性能面板">×</button></div>
  <div class="perf-row"><span>FPS / 帧率</span><b id="statFps">采样中</b></div>
  <div class="perf-row"><span>FRAME / 帧间隔</span><b id="statFrame">—</b></div>
  <div class="perf-row"><span>DRAW / JS绘制</span><b id="statDraw">—</b></div>
  <div class="perf-row"><span>STUTTER / &gt;50ms</span><b id="statStutter">—</b></div>
  <div class="perf-row"><span>JS HEAP / 堆内存</span><b id="statHeap">—</b></div>
  <div class="perf-row"><span>ENGINE</span><b id="statEngine">—</b></div>
  <div class="perf-row"><span>CANVAS / 像素</span><b id="statCanvas">—</b></div>
  <div class="perf-chart" id="perfChart" aria-label="过去24秒帧率变化"></div>
  <div class="perf-info">每秒采样。JS堆不等于整个进程内存；JS绘制耗时不等于CPU占用率。GPU实际利用率、显存请看Windows任务管理器。</div>
</div>

<div class="toast" id="toast"></div>
<audio id="player" loop></audio>
<script>
(() => {
'use strict';
// PHYSICS CORE v2.2 — Captured Stardust & Rare Comets, offline-capable Wallpaper Engine web wallpaper.
// Uses native WebGL + Canvas 2D, no CDN, no images, no third-party scripts.
const canvas=document.getElementById('space');
const overlay=document.getElementById('orbits');
const ctx=overlay.getContext('2d',{alpha:true});
const gl=canvas.getContext('webgl',{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false,powerPreference:'high-performance'}) || canvas.getContext('experimental-webgl');
const byId=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
// Motion philosophy: visible mechanical rotation + coherent particle flow + slower
// volumetric breathing. Original interface and color palette intentionally retained.
const TAU=Math.PI*2;
const motion={reactor:1,orbital:1,flow:1};
let W=innerWidth,H=innerHeight,D=1,CX=0,CY=0,scale=1;
let now=0,last=0,pause=false,frame=0,hasWallpaperAudio=false,lastWallpaperAudio=-10000;
let bass=0,mid=0,treble=0,targetBass=0,targetMid=0,targetTreble=0,demo=false,audioSource=false;
let mouseX=0,mouseY=0,tiltX=0,tiltY=0;

// --- Meteor Resonance V2.1: refined stone, deliberate interactions, bounded pools ---
// Arrays remain capped for long-running wallpapers. All motion uses frame dt.
const interact={
 on:true,meteors:[],dust:[],rings:[],captured:[],comet:null,hover:null,next:now+5,nextComet:now+90,id:0,
 quality:1,qualityWindow:0,qualityFrames:0,qualityLow:0,qualityHigh:0,
 coreResonance:0,coreSourceX:0,coreSourceY:0,capturePulse:0
};
const pointer={x:0,y:0,inside:false,moved:-9999};
let frameDelta=1/60;
const METEOR_MAX=2,DUST_MAX=64,RING_MAX=3,CAPTURE_MAX=18;
function meteorHit(x,y){
 if(!interact.on)return null;
 for(let i=interact.meteors.length-1;i>=0;i--){
  const m=interact.meteors[i];
  if(m.state!=='flying')continue;
  const dx=x-m.x,dy=y-m.y;
  // Generous interaction area without adding a visible UI bubble.
  if(dx*dx+dy*dy<Math.pow(Math.max(24,m.r*1.8),2))return m;
 }
 return null;
}
function refreshAim(){
 interact.hover=interact.on&&pointer.inside?meteorHit(pointer.x,pointer.y):null;
 document.body.classList.toggle('meteor-aim',!!interact.hover);
}
function setMeteorMode(on){
 interact.on=typeof on==='boolean'?on:!interact.on;
 if(!interact.on){
  interact.meteors.length=0;interact.dust.length=0;interact.rings.length=0;
  interact.captured.length=0;interact.comet=null;interact.capturePulse=0;
  interact.hover=null;interact.coreResonance=0;
 }else{interact.next=now+3+Math.random()*4;planComet(true);}
 const btn=byId('meteorBtn');
 btn.textContent=interact.on?'☄':'○';
 btn.setAttribute('aria-pressed',String(interact.on));
 btn.title=interact.on?'陨石互动已开启（M关闭）':'陨石互动已关闭（M开启）';
 btn.setAttribute('aria-label',btn.title);
 refreshAim();
}
function spawnMeteor(){
 if(interact.meteors.length>=METEOR_MAX)return;
 let x,y,ex,ey;
 const horizontal=Math.random()<.5,reverse=Math.random()<.5;
 const lane=.10+Math.random()*.17,far=Math.random()<.5;
 if(horizontal){
  y=H*(far?1-lane:lane);x=reverse?W+35:-35;
  ex=reverse?-50:W+50;ey=y+(Math.random()-.5)*H*.11;
 }else{
  x=W*(far?1-lane:lane);y=reverse?H+35:-35;
  ey=reverse?-50:H+50;ex=x+(Math.random()-.5)*W*.11;
 }
 const distance=Math.hypot(ex-x,ey-y),speed=42+Math.random()*33;
 const typeRoll=Math.random(),kind=typeRoll<.12?'gold':typeRoll<.48?'ice':'dark';
 const r=11+Math.random()*10,seed=Math.random()*TAU;
 const sides=11,shape=[];
 for(let i=0;i<sides;i++){
  shape.push(.82+.15*Math.sin(i*4.27+seed*2)+.055*Math.cos(i*7.9+seed));
 }
 const vx=(ex-x)/distance*speed,vy=(ey-y)/distance*speed;
 interact.meteors.push({
  id:++interact.id,x,y,vx,vy,baseVx:vx,baseVy:vy,
  r,kind,gold:kind==='gold',seed,shape,age:0,maxAge:Math.min(48,(distance+95)/speed),
  spin:(Math.random()-.5)*.19,state:'flying',breakT:0,lock:0
 });
}
function releaseMeteorFragments(m){
 const cap=interact.quality===1?24:14;
 const count=Math.min(DUST_MAX-interact.dust.length,12+Math.floor(Math.random()*13),cap);
 const quota=Math.min(interact.quality?4:2,CAPTURE_MAX-interact.captured.length,Math.floor(count/4));
 let captured=0;
 for(let k=0;k<count;k++){
  const a=k/Math.max(1,count)*TAU+(Math.random()-.5)*.34;
  const speed=45+Math.random()*86;
  const ttl=.55+Math.random()*.65;
  if(k%5===0&&captured<quota&&captureFragment(m,a)){captured++;continue;}
  interact.dust.push({
   x:m.x,y:m.y,vx:Math.cos(a)*speed+m.vx*.13,
   vy:Math.sin(a)*speed+m.vy*.13,life:ttl,ttl,
   r:.75+Math.random()*1.8,
   color:m.kind==='gold'?'gold':m.kind==='ice'?'ice':'dark'
  });
 }
 if(interact.rings.length>=RING_MAX)interact.rings.shift();
 interact.rings.push({x:m.x,y:m.y,base:m.r,life:.58,ttl:.58,gold:m.gold});
 if(m.gold){
  interact.coreSourceX=m.x;interact.coreSourceY=m.y;
  interact.coreResonance=Math.max(interact.coreResonance,.75);
 }
}
function shatterMeteor(m){
 if(!interact.on||!m||m.state!=='flying')return;
 // Charging: 0–0.09 s, crystallization cracks: 0.09–0.23 s.
 // The actual fragments are released at 0.23 s; no double activation.
 m.state='fracturing';m.breakT=0;m.lock=0;
 interact.hover=null;refreshAim();
}
function sampleInteractionQuality(dt){
 interact.qualityWindow+=dt;interact.qualityFrames++;
 if(interact.qualityWindow<3)return;
 const measured=interact.qualityFrames/interact.qualityWindow;
 if(measured<42){
  interact.qualityLow++;interact.qualityHigh=0;
 }else if(measured>53){
  interact.qualityHigh++;interact.qualityLow=0;
 }else{interact.qualityLow=0;interact.qualityHigh=0;}
 if(interact.qualityLow>=2)interact.quality=0; // sustained low FPS, not a single spike
 if(interact.qualityHigh>=3)interact.quality=1;
 interact.qualityWindow=0;interact.qualityFrames=0;
}
function tickInteraction(dt){
 if(!interact.on)return;
 sampleInteractionQuality(dt);
 tickCelestial(dt);
 if(now>=interact.nextComet){
  if(!interact.comet&&interact.quality===1)spawnComet();
  planComet();
 }
 interact.coreResonance=Math.max(0,interact.coreResonance-dt*1.12);
 if(now>=interact.next){
  if(interact.meteors.length<METEOR_MAX)spawnMeteor();
  const idle=!pointer.inside||now-pointer.moved>45;
  interact.next=now+(idle?25+Math.random()*13:12+Math.random()*10);
 }
 const smoothing=1-Math.exp(-dt*9.8);
 for(let i=interact.meteors.length-1;i>=0;i--){
  const m=interact.meteors[i];
  if(m.state==='fracturing'){
   m.breakT+=dt;
   if(m.breakT>=.23){
    releaseMeteorFragments(m);interact.meteors.splice(i,1);
   }
   continue;
  }
  // A 0.2 s celestial acquisition animation. Clicks work immediately.
  m.lock+=((interact.hover===m?1:0)-m.lock)*smoothing;
  let targetVx=m.baseVx,targetVy=m.baseVy;
  if(pointer.inside){
   const dx=pointer.x-m.x,dy=pointer.y-m.y;
   const d=Math.hypot(dx,dy),radius=190;
   if(d>1&&d<radius){
    // Very weak gravity, max ~8 px/s change; never snaps to pointer.
    const influence=Math.pow(1-d/radius,2);
    targetVx+=dx/d*Math.min(8,influence*9);
    targetVy+=dy/d*Math.min(8,influence*9);
   }
  }
  const drift=1-Math.exp(-dt*1.2);
  m.vx+=(targetVx-m.vx)*drift;m.vy+=(targetVy-m.vy)*drift;
  const hoveredSlow=1-.27*m.lock;
  m.x+=m.vx*dt*hoveredSlow;m.y+=m.vy*dt*hoveredSlow;m.age+=dt;
  if(m.age>m.maxAge||m.x< -130||m.x>W+130||m.y< -130||m.y>H+130)
   interact.meteors.splice(i,1);
 }
 const damping=Math.exp(-dt*2.8);
 for(let i=interact.dust.length-1;i>=0;i--){
  const p=interact.dust[i];
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=damping;p.vy*=damping;p.life-=dt;
  if(p.life<=0)interact.dust.splice(i,1);
 }
 for(let i=interact.rings.length-1;i>=0;i--){
  const r=interact.rings[i];r.life-=dt;
  if(r.life<=0)interact.rings.splice(i,1);
 }
 refreshAim();
}

// V2.2: selected debris becomes core-bound; a rare comet visits the background.
function captureFragment(m,a){
 if(interact.captured.length>=18)return false;
 const x=m.x+Math.cos(a)*m.r*.45,y=m.y+Math.sin(a)*m.r*.45;
 const dx=x-CX,dy=y-CY;
 interact.captured.push({x,y,px:x,py:y,radius:Math.hypot(dx,dy),angle:Math.atan2(dy,dx),
  spin:(Math.random()<.5?-1:1)*(.7+Math.random()*.4),age:0,ttl:1.6+Math.random()*.8,
  size:.8+Math.random()*1.15,gold:m.gold});
 return true;
}
function planComet(initial=false){
 const idle=!pointer.inside||now-pointer.moved>45;
 interact.nextComet=now+(initial?55+Math.random()*65:idle?175+Math.random()*105:125+Math.random()*95);
}
function spawnComet(){
 if(!interact.on||interact.comet)return false;
 const horizontal=Math.random()<.75,dir=Math.random()<.5?1:-1;
 const lane=.08+Math.random()*.13,low=Math.random()<.5;
 let x,y,tx,ty;
 if(horizontal){
  x=dir>0?-160:W+160;y=H*(low?1-lane:lane);
  tx=dir>0?W+165:-165;ty=y+(Math.random()-.5)*H*.07;
 }else{
  y=dir>0?-160:H+160;x=W*(low?1-lane:lane);
  ty=dir>0?H+165:-165;tx=x+(Math.random()-.5)*W*.07;
 }
 const d=Math.hypot(tx-x,ty-y),speed=125+Math.random()*50;
 interact.comet={x,y,vx:(tx-x)/d*speed,vy:(ty-y)/d*speed,
  age:0,ttl:d/speed+1,head:2.5+Math.random(),
  tail:clamp(Math.min(W,H)*(.09+Math.random()*.046),60,155),
  seed:Math.random()*TAU,gold:Math.random()<.18};
 return true;
}
function tickCelestial(dt){
 interact.capturePulse=Math.max(0,interact.capturePulse-dt*1.05);
 for(let i=interact.captured.length-1;i>=0;i--){
  const p=interact.captured[i];p.age+=dt;
  if(p.age>=p.ttl){
   interact.captured.splice(i,1);
   interact.capturePulse=Math.min(.6,interact.capturePulse+.18);
   continue;
  }
  const f=clamp(p.age/p.ttl,0,1),ease=f*f*(3-2*f);
  const r=p.radius*(1-ease),a=p.angle+p.spin*ease;
  p.px=p.x;p.py=p.y;p.x=CX+Math.cos(a)*r;p.y=CY+Math.sin(a)*r;
 }
 const c=interact.comet;
 if(c){
  c.age+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;
  if(c.age>c.ttl||c.x< -280||c.x>W+280||c.y< -280||c.y>H+280)interact.comet=null;
 }
}
function drawCaptured(){
 if(!interact.captured.length&&!interact.capturePulse)return;
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(const p of interact.captured){
  const f=p.age/p.ttl,alpha=clamp(Math.min(f*8,1,(1-f)*7),0,1)*.73;
  const col=p.gold?'255,211,153':'149,225,250';
  ctx.strokeStyle='rgba('+col+','+(alpha*.26)+')';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();
  ctx.fillStyle='rgba('+col+','+alpha+')';
  ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-.4*f),0,TAU);ctx.fill();
 }
 if(interact.capturePulse>.004){
  const p=interact.capturePulse;
  ctx.strokeStyle='rgba(154,221,249,'+(p*.22)+')';
  ctx.lineWidth=.6+p*.8;ctx.beginPath();
  ctx.arc(CX,CY,scale*(.32+.08*(1-p)),0,TAU);ctx.stroke();
 }
 ctx.restore();
}
function drawComet(t){
 const c=interact.comet;if(!interact.on||!c)return;
 const alpha=clamp(c.age/1.2,0,1)*clamp((c.ttl-c.age)/1.1,0,1);
 const mag=Math.hypot(c.vx,c.vy)||1,ux=c.vx/mag,uy=c.vy/mag,nx=-uy,ny=ux;
 const length=c.tail*(interact.quality===0?.65:1);
 let bend=0;
 if(pointer.inside){
  const d=Math.hypot(pointer.x-c.x,pointer.y-c.y);
  if(d<220)bend=(pointer.x-c.x)*.04*(1-d/220);
 }
 const sx=c.x-ux*length+nx*bend,sy=c.y-uy*length+ny*bend;
 ctx.save();ctx.globalAlpha=alpha;ctx.globalCompositeOperation='lighter';
 const grad=ctx.createLinearGradient(sx,sy,c.x,c.y);
 grad.addColorStop(0,'rgba(104,181,229,0)');
 grad.addColorStop(.62,c.gold?'rgba(255,202,141,.04)':'rgba(133,209,248,.04)');
 grad.addColorStop(1,c.gold?'rgba(255,224,164,.35)':'rgba(178,231,255,.33)');
 ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(sx,sy);
 ctx.quadraticCurveTo(c.x-ux*length*.45+nx*Math.sin(t+c.seed)*3,
  c.y-uy*length*.45+ny*Math.sin(t+c.seed)*3,c.x+nx*1.4,c.y+ny*1.4);
 ctx.lineTo(c.x-nx*1.4,c.y-ny*1.4);ctx.closePath();ctx.fill();
 ctx.strokeStyle=c.gold?'rgba(255,217,158,.25)':'rgba(175,227,252,.26)';
 ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(c.x,c.y);ctx.stroke();
 ctx.shadowColor=c.gold?'#ffe7b9':'#a8e6ff';ctx.shadowBlur=interact.quality?8:2;
 const core=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.head*3.5);
 core.addColorStop(0,'rgba(255,255,247,.91)');
 core.addColorStop(.38,c.gold?'rgba(255,220,165,.45)':'rgba(181,233,255,.48)');
 core.addColorStop(1,'rgba(118,205,255,0)');
 ctx.fillStyle=core;ctx.beginPath();ctx.arc(c.x,c.y,c.head*3.5,0,TAU);ctx.fill();
 ctx.restore();
}

const METEOR_PALETTES={
 dark:{light:'#536d82',mid:'#2b3c4e',shade:'#101b2a',edge:'#6899ac',crack:'#78cced',facets:['#3b5061','#1a2b3b','#293c4e','#122438']},
 ice:{light:'#7aafc9',mid:'#305873',shade:'#0b253d',edge:'#98e2f7',crack:'#b4f3ff',facets:['#497a99','#153955','#2b607d','#16364e']},
 gold:{light:'#ae8a61',mid:'#594335',shade:'#201a21',edge:'#ecc18b',crack:'#ffe2ae',facets:['#83644a','#372f31','#69503c','#25262e']}
};
function traceRockPath(m){
 ctx.beginPath();
 const n=m.shape.length;
 for(let i=0;i<n;i++){
  const theta=i*TAU/n,r=m.r*m.shape[i],x=Math.cos(theta)*r,y=Math.sin(theta)*r;
  if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.closePath();
}
function paintMeteor(m,t){

 let cg=ctx.createRadialGradient(CX,CY,4,CX,CY,scale*.64);cg.addColorStop(0,'#ffcc89');cg.addColorStop(.08,'#a66c41');cg.addColorStop(.32,'#041528');cg.addColorStop(.75,'#0b3355');cg.addColorStop(1,'transparent');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(CX,CY,scale*.65,0,6.283);ctx.fill();}
function drawStars(t){ctx.save();for(const s of stars){const x=(s.x+Math.sin(t*.018+s.phase)*.0018)*W,y=(s.y+Math.cos(t*.016+s.phase)*.0018)*H,twinkle=.38+.48*(.5+.5*Math.sin(t*(.6+s.b)+s.phase));ctx.fillStyle=s.b>.94?'rgba(255,208,150,'+twinkle+')':'rgba(126,210,239,'+(twinkle*.65)+')';ctx.beginPath();ctx.arc(x,y,s.r*(s.b>.97?1.5:1),0,6.283);ctx.fill();}ctx.restore()}
function drawIons(t){
 ctx.save();ctx.globalCompositeOperation='lighter';
 const field=interact.on&&pointer.inside;
 const radius=Math.min(W,H)*.205,smooth=1-Math.exp(-frameDelta*6);
 for(const p of ions){
  const a=p.a+t*p.speed*2.4/(.7+p.r*.7),r=p.r*(1+.032*Math.sin(t*1.8+p.seed));
  const z=Math.sin(a*1.7+p.seed)*p.plane;
  const v3=spin3(Math.cos(a)*r,Math.sin(a)*r,z,.32,-.17,.28);
  const v=project(...v3);
  if(Math.hypot(v[0]-CX,v[1]-CY)/scale<.26)continue;
  let targetX=0,targetY=0;
  if(field){
   const dx=pointer.x-v[0],dy=pointer.y-v[1],d=Math.hypot(dx,dy);
   if(d<radius){const force=.43*Math.pow(1-d/radius,2);
    targetX=dx*force;targetY=dy*force;}
  }
  p.gx+=(targetX-p.gx)*smooth;p.gy+=(targetY-p.gy)*smooth;
  const alpha=clamp(.09+(v3[2]+1)*.18,0,.5)*(.7+audioStrength()*.9);
  ctx.fillStyle=p.gold?'rgba(255,181,111,'+alpha+')':'rgba(78,193,253,'+alpha+')';
  const size=p.size*(.85+audioStrength()*.35);
  ctx.fillRect(v[0]+p.gx,v[1]+p.gy,size,size);
 }
 ctx.restore();
}
function drawCorona(t){
 // Only four faint ion glimmers close to the sphere, not new orbital tracks.
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(let i=0;i<4;i++){
  const a=i*TAU/4+t*(i%2?-.035:.03);
  ctx.strokeStyle=i===0?'rgba(255,188,108,.17)':'rgba(89,210,250,.12)';
  ctx.shadowColor=i===0?'#ffcf97':'#88deff';ctx.shadowBlur=5;ctx.lineWidth=.85;
  ctx.beginPath();ctx.arc(CX,CY,scale*.37,a,a+.10);ctx.stroke();
 }
 ctx.restore();
}
function drawBeams(t){ctx.save();ctx.translate(CX,CY);ctx.rotate(-.30);
 ctx.globalCompositeOperation='lighter';
 const a=audioStrength();
 for(let k=0;k<2;k++){
 let length=scale*(1.35+.08*a),w=scale*(.26+.07*a),gg=ctx.createLinearGradient(-length,0,length,0);
 gg.addColorStop(0,'rgba(14,81,123,0)');gg.addColorStop(.35,'rgba(30,141,201,.012)');gg.addColorStop(.5,'rgba(97,218,255,.080)');gg.addColorStop(.65,'rgba(28,147,204,.014)');gg.addColorStop(1,'rgba(7,77,120,0)');
 ctx.fillStyle=gg;ctx.beginPath();ctx.ellipse(0,0,length,w,k?0.03:-0.03,0,6.283);ctx.fill();
 }ctx.restore();}

// Minimal translucent volumetric accretion light; no duplicate orbit ellipses.
function drawPlasmaDisk(t){
 ctx.save();ctx.translate(CX,CY);ctx.rotate(-.31);
 ctx.globalCompositeOperation='lighter';const e=audioStrength();
 const r=scale*1.10;
 const g=ctx.createRadialGradient(0,0,scale*.12,0,0,r);
 g.addColorStop(0,'rgba(255,184,107,.052)');
 g.addColorStop(.38,'rgba(102,182,231,.033)');
 g.addColorStop(.74,'rgba(60,150,215,.017)');
 g.addColorStop(1,'rgba(20,60,120,0)');
 ctx.scale(1,.32/1.10);
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*(1+e*.03),0,TAU);ctx.fill();ctx.restore();
}
// Clear central visual hierarchy: real opaque sphere, then soft plasma glow.
function drawCoreOrnament(t){
 const e=audioStrength(),R=scale*.36*(1+.010*Math.sin(t*1.2)+e*.035);
 ctx.save();ctx.translate(CX,CY);
 ctx.globalCompositeOperation='lighter';
 let halo=ctx.createRadialGradient(0,0,R*.1,0,0,R*1.6);
 halo.addColorStop(0,'rgba(239,178,96,.12)');
 halo.addColorStop(.42,'rgba(52,163,228,.055)');
 halo.addColorStop(.78,'rgba(17,119,208,.022)');
 halo.addColorStop(1,'rgba(0,70,130,0)');
 ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,R*1.6,0,TAU);ctx.fill();
 // Use source-over for the dark body: it must hide rear orbit geometry.
 ctx.globalCompositeOperation='source-over';
 const body=ctx.createRadialGradient(-R*.15,-R*.2,R*.04,0,0,R);
 body.addColorStop(0,'rgba(3,13,32,.97)');
 body.addColorStop(.52,'rgba(2,17,38,.97)');
 body.addColorStop(.79,'rgba(4,31,56,.96)');
 body.addColorStop(.94,'rgba(8,66,96,.93)');
 body.addColorStop(1,'rgba(22,124,166,.83)');
 ctx.fillStyle=body;ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.fill();
 ctx.globalCompositeOperation='lighter';
 ctx.save();ctx.shadowColor='#5bd6ff';ctx.shadowBlur=13;
 ctx.strokeStyle='rgba(101,211,252,.62)';ctx.lineWidth=1.45;
 ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.stroke();ctx.restore();
 // Only one fine equatorial ellipse and 24 faint engraved divisions.
 ctx.strokeStyle='rgba(91,189,223,.12)';ctx.lineWidth=.8;
 ctx.save();ctx.rotate(t*.035);ctx.beginPath();
 ctx.ellipse(0,0,R*.69,R*.29,.35,0,TAU);ctx.stroke();ctx.restore();
 ctx.save();ctx.rotate(-t*.025);
 for(let i=0;i<24;i++){
  const a=i*TAU/24,rr=R*(i%3===0?.87:.92),rt=R*.944;
  ctx.strokeStyle=i%3===0?'rgba(255,194,111,.21)':'rgba(104,194,224,.10)';
  ctx.lineWidth=i%3===0?.9:.5;
  ctx.beginPath();ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
  ctx.lineTo(Math.cos(a)*rt,Math.sin(a)*rt);ctx.stroke();
 }
 ctx.restore();
 // Restrained center quasar dominates everything around it.
 const nr=R*(.31+.013*Math.sin(t*1.4)+e*.10);
 const aperture=ctx.createRadialGradient(0,0,0,0,0,nr*1.85);
 aperture.addColorStop(0,'rgba(255,251,225,.96)');
 aperture.addColorStop(.14,'rgba(255,221,145,.86)');
 aperture.addColorStop(.34,'rgba(255,157,82,.45)');
 aperture.addColorStop(.63,'rgba(70,175,243,.23)');
 aperture.addColorStop(1,'rgba(8,87,173,0)');
 ctx.fillStyle=aperture;ctx.beginPath();ctx.arc(0,0,nr*1.85,0,TAU);ctx.fill();
 // Two delicate gem-like crescents, not a tangle of rings.
 for(let i=0;i<2;i++){
  ctx.save();ctx.rotate(t*(i?-.07:.055)+i*1.5);
  ctx.shadowColor=i?'#81dfff':'#ffe0a1';ctx.shadowBlur=6;
  ctx.strokeStyle=i?'rgba(108,213,249,.33)':'rgba(255,215,151,.55)';
  ctx.lineWidth=i?.8:1.0;
  ctx.beginPath();ctx.arc(0,0,R*(i?.49:.36),.18,1.38);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,R*(i?.49:.36),3.35,4.38);ctx.stroke();ctx.restore();
 }
 ctx.restore();
}
// Decorative racing packets removed to make clock ticks and ornate pointers legible.

function drawOverlay(t){
 ctx.clearRect(0,0,W,H);
 if(!gl||!program)drawNebulaFallback();
 drawStars(t);drawComet(t);drawBeams(t);drawPlasmaDisk(t);
 for(const o of orbitConfigs)drawOrbit(o,t,false);
 drawIons(t);
 drawCoreOrnament(t);
 drawCorona(t);
 for(const o of orbitConfigs)drawOrbit(o,t,true);
 paintMeteors(t);
}
// --------------------------- Wallpaper Engine audio ----------------------------
// Wallpaper Engine calls this with 64 bands per channel at ~30Hz.
function wallpaperAudioListener(samples){if(!samples||samples.length<128)return;hasWallpaperAudio=true;lastWallpaperAudio=performance.now();
 const average=(lo,hi)=>{let s=0;for(let i=lo;i<hi;i++)s+=(Math.min(1,samples[i]||0)+Math.min(1,samples[i+64]||0))*.5;return s/(hi-lo)};
 targetBass=clamp(average(0,7)*2.7,0,1);targetMid=clamp(average(8,27)*3.7,0,1);targetTreble=clamp(average(28,63)*5.,0,1);
}
if(typeof window.wallpaperRegisterAudioListener==='function'){
  window.wallpaperRegisterAudioListener(wallpaperAudioListener);
  
}
// Optional wallpaper settings, when user properties are later added in editor.
window.wallpaperPropertyListener={applyUserProperties:function(properties){
 if(properties.showhud)document.body.classList.toggle('ui-off',!properties.showhud.value);
}};
function readAudio(t){
 if(hasWallpaperAudio&&performance.now()-lastWallpaperAudio<1200){demo=false;return;}
 if(analyser&&audioSource&&!byId('player').paused){analyser.getByteFrequencyData(freqData);
 const avg=(a,b)=>{let sum=0;for(let i=a;i<b;i++)sum+=freqData[i]||0;return sum/((b-a)*255)};
 targetBass=clamp(avg(1,9)*2.1,0,1);targetMid=clamp(avg(10,45)*2.4,0,1);targetTreble=clamp(avg(46,150)*3,0,1);return;
 }
 if(demo){const beat=(x)=>Math.pow(Math.max(0,Math.sin(x)),8);
 targetBass=.19+.7*beat(t*4.0)+.12*beat(t*9.5);targetMid=.14+.51*beat(t*2.7+.6);targetTreble=.14+.66*beat(t*7.8+1.8);
 return;
 }
 targetBass=.06+.035*Math.sin(t*.85);targetMid=.045+.025*Math.sin(t*.7+1);targetTreble=.04+.035*Math.sin(t*1.3+2);
}
byId('demoBtn').addEventListener('click',()=>{demo=!demo;audioSource=false;byId('player').pause();toast(demo?'演示节拍已开启（模拟波动，无声音）':'已切换为静默呼吸模式')});
byId('audioFile').addEventListener('change',async(e)=>{
 const file=e.target.files&&e.target.files[0];if(!file)return;
 try{
  let player=byId('player');if(player.src.startsWith('blob:'))URL.revokeObjectURL(player.src);
  player.src=URL.createObjectURL(file);player.volume=.66;
  if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.79;freqData=new Uint8Array(analyser.frequencyBinCount);
   srcNode=audioCtx.createMediaElementSource(player);srcNode.connect(analyser);analyser.connect(audioCtx.destination);
  }
  await audioCtx.resume();await player.play();audioSource=true;demo=false;toast('正在播放：'+file.name.slice(0,29));
 }catch(err){toast('音乐加载失败，请检查浏览器音频权限');console.error(err)}
});
byId('hudBtn').addEventListener('click',()=>document.body.classList.toggle('ui-off'));
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')document.body.classList.toggle('ui-off');if(e.key.toLowerCase()==='m'&&!['INPUT','TEXTAREA'].includes(e.target.tagName))setMeteorMode();if(e.key.toLowerCase()==='p'&&!['INPUT','TEXTAREA'].includes(e.target.tagName))perfToggle();if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();demo=!demo;}});
byId('meteorBtn').addEventListener('click',()=>setMeteorMode());
addEventListener('mousemove',e=>{
 mouseX=(e.clientX/W-.5)*2;mouseY=(e.clientY/H-.5)*2;
 pointer.x=e.clientX;pointer.y=e.clientY;pointer.inside=true;pointer.moved=now;
 refreshAim();
},{passive:true});
addEventListener('mouseout',e=>{if(!e.relatedTarget){pointer.inside=false;refreshAim();}});
addEventListener('blur',()=>{pointer.inside=false;refreshAim();});
addEventListener('click',e=>{
 if(!interact.on||e.button!==0||e.target?.closest?.('.interface,.perf-panel'))return;
 const meteor=meteorHit(e.clientX,e.clientY);if(meteor)shatterMeteor(meteor);
});
addEventListener('visibilitychange',()=>{pause=document.hidden;last=performance.now();perfMon.t0=0;perfMon.frames=0;perfMon.drawMs=0;perfMon.stutter=0;});

/* Optional browser-only performance telemetry; GPU/RAM/CPU usage cannot be directly measured here. */
const perfMon={open:false,t0:0,frames:0,drawMs:0,stutter:0,history:[]};
function perfToggle(state){
 perfMon.open=typeof state==='boolean'?state:!perfMon.open;
 byId('perfPanel').classList.toggle('open',perfMon.open);
 perfMon.t0=0;perfMon.frames=0;perfMon.drawMs=0;perfMon.stutter=0;
 if(perfMon.open){
  byId('statFps').textContent='采样中';
  byId('statEngine').textContent=gl&&program?'WEBGL + 2D':'CANVAS 2D';
  byId('statCanvas').textContent=canvas.width+'×'+canvas.height+' / '+overlay.width+'×'+overlay.height;
 }
}
byId('perfBtn').addEventListener('click',()=>perfToggle());
byId('perfClose').addEventListener('click',()=>perfToggle(false));
function perfSample(ms,interval,renderMs){
 if(!perfMon.open)return;
 if(!perfMon.t0)perfMon.t0=ms;
 perfMon.frames++;perfMon.drawMs+=renderMs;
 if(interval>50)perfMon.stutter++;
 const duration=ms-perfMon.t0;
 if(duration<1000)return;
 const fps=perfMon.frames*1000/Math.max(1,duration);
 const fpsEl=byId('statFps');
 fpsEl.textContent=fps.toFixed(1);fpsEl.classList.toggle('warn',fps<45);
 byId('statFrame').textContent=(duration/perfMon.frames).toFixed(1)+' ms';
 byId('statDraw').textContent=(perfMon.drawMs/perfMon.frames).toFixed(1)+' ms';
 byId('statStutter').textContent=perfMon.stutter+' / s';
 const mem=performance.memory; // Chromium-specific, approximate JavaScript heap only.
 if(mem&&typeof mem.usedJSHeapSize==='number'){
  const used=(mem.usedJSHeapSize/1048576).toFixed(1);
  const alloc=typeof mem.totalJSHeapSize==='number'?' / '+(mem.totalJSHeapSize/1048576).toFixed(0):'';
  byId('statHeap').textContent=used+alloc+' MB';
 }else byId('statHeap').textContent='N/A';
 byId('statCanvas').textContent=canvas.width+'×'+canvas.height+' / '+overlay.width+'×'+overlay.height;
 perfMon.history.push(fps);
 if(perfMon.history.length>24)perfMon.history.shift();
 byId('perfChart').innerHTML=perfMon.history.map(n=>'<i class="'+(n<45?'warn':'')+'" style="height:'+Math.max(5,Math.min(100,n/60*100)).toFixed(1)+'%"></i>').join('');
 perfMon.t0=ms;perfMon.frames=0;perfMon.drawMs=0;perfMon.stutter=0;
}

function loop(ms){requestAnimationFrame(loop);if(pause)return;
 if(!last)last=ms;const rawInterval=ms-last;const dt=Math.min(.05,rawInterval/1000);frameDelta=dt;last=ms;now+=dt;
 tickInteraction(dt);
 const startRender=perfMon.open?performance.now():0;
 readAudio(now);let smoothing=1-Math.exp(-dt*9.5);bass=lerp(bass,targetBass,smoothing);mid=lerp(mid,targetMid,smoothing);treble=lerp(treble,targetTreble,smoothing);
 tiltX=lerp(tiltX,mouseX,.025);tiltY=lerp(tiltY,mouseY,.025);
 if(gl&&program){gl.useProgram(program);gl.uniform2f(uRes,canvas.width,canvas.height);gl.uniform1f(uTime,now);gl.uniform3f(uAudio,bass,mid,treble);gl.uniform2f(uDrift,tiltX,tiltY);gl.drawArrays(gl.TRIANGLES,0,6);}
 drawOverlay(now);
 if(perfMon.open)perfSample(ms,rawInterval,performance.now()-startRender);
}
requestAnimationFrame(loop);
})();
</script>
